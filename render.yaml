databases:
  - name: showout-db
    databaseName: showout
    user: showout
    plan: free

services:
  - type: web
    name: showout
    runtime: node
    plan: free
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build && npm run db:migrate
    startCommand: npm start
    initialDeployHook: npm run seed
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: showout-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: PILOT_LOGIN_ENABLED
        value: "true"
      - key: PILOT_ACCESS_CODE
        sync: false
      - key: DATA_ADAPTER
        value: postgres
      - key: STORAGE_ADAPTER
        value: local
      - key: LOCAL_UPLOAD_DIR
        value: /tmp/showout-uploads
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: EXPO_WEB_ORIGIN
        sync: false
